name: easycrm-production
x-backend: &backend
  build:
    context: .
    dockerfile: infrastructure/backend.Dockerfile
  env_file: .env
  environment: &environment
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-easycrm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-easycrm}
    ENVIRONMENT: production
    COOKIE_SECURE: "true"
    REQUIRE_WORKER_READY: "true"
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  mem_limit: 512m
  pids_limit: 128
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-easycrm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-easycrm}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}
  backend:
    <<: *backend
    restart: unless-stopped
    # Only the internal frontend can reach this port. Ignore forwarded IP claims.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log", "--no-proxy-headers", "--limit-concurrency", "100", "--timeout-keep-alive", "5"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready')"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 30s
  channel-worker:
    <<: *backend
    restart: unless-stopped
    command: ["python", "-m", "app.channel_worker"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  frontend:
    build:
      context: .
      dockerfile: infrastructure/frontend.production.Dockerfile
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      backend: {condition: service_healthy}
volumes:
  postgres_data:
