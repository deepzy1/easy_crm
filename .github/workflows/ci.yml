name: EasyCRM verification
on: [push, pull_request]
jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: easycrm
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: easycrm_test
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready -U easycrm -d easycrm_test" --health-interval=3s --health-timeout=3s --health-retries=20
    env:
      DATABASE_URL: postgresql+psycopg://easycrm:test-password@localhost:5432/easycrm_test
      TEST_DATABASE_URL: postgresql+psycopg://easycrm:test-password@localhost:5432/easycrm_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m venv .venv && .venv/bin/pip install --require-hashes -r requirements-dev.lock
        working-directory: backend
      - run: .venv/bin/alembic upgrade head && .venv/bin/alembic check && .venv/bin/pytest -q
        working-directory: backend
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: PLAYWRIGHT_QUALIFICATION_FIXTURE=1 npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results/
